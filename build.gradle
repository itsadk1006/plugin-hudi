plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'io.kestra.plugin'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Kestra core
    compileOnly "io.kestra:core:0.20.0"
    annotationProcessor "io.kestra:core:0.20.0"

    // Lombok
    compileOnly "org.projectlombok:lombok:1.18.36"
    annotationProcessor "org.projectlombok:lombok:1.18.36"

    // Apache Hudi Java client
    implementation "org.apache.hudi:hudi-java-client:1.2.0"

    // Testing dependencies & Micronaut test runner harness
    testImplementation "io.kestra:core:0.20.0"
    testImplementation "io.kestra:tests:0.20.0"
    testImplementation "io.kestra:repository-memory:0.20.0"
    testImplementation "io.kestra:runner-memory:0.20.0"
    testImplementation "io.kestra:storage-local:0.20.0"
    
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testCompileOnly "org.projectlombok:lombok:1.18.36"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.36"
    testAnnotationProcessor "io.kestra:core:0.20.0"
    testAnnotationProcessor "io.micronaut:micronaut-inject-java:4.5.0"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor:4.5.0"
    
    testImplementation "org.assertj:assertj-core:3.25.3"
    testImplementation "org.hamcrest:hamcrest:2.2"
    testImplementation "io.micronaut.test:micronaut-test-junit5:4.5.0"
}

test {
    useJUnitPlatform()
}