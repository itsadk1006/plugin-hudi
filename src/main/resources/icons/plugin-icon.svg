<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="hudi-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#005B94" />
    </linearGradient>
    <linearGradient id="hudi-grad-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <linearGradient id="hudi-grad-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
  </defs>
  <!-- Apache Hudi Origami / Faceted Emblem -->
  <g id="hudi-mark">
    <!-- Back wing / crown -->
    <polygon points="64,12 88,38 64,48 40,38" fill="url(#hudi-grad-a)" />
    <!-- Left upper facet -->
    <polygon points="40,38 64,48 50,78 20,54" fill="#0288D1" />
    <!-- Right upper facet -->
    <polygon points="88,38 64,48 78,78 108,54" fill="url(#hudi-grad-b)" />
    <!-- Center chest facet -->
    <polygon points="64,48 78,78 64,104 50,78" fill="#01579B" />
    <!-- Left wing fold -->
    <polygon points="20,54 50,78 36,112 12,82" fill="#0277BD" />
    <!-- Right wing fold -->
    <polygon points="108,54 78,78 92,112 116,82" fill="#039BE5" />
    <!-- Bottom tail anchor / orange accent -->
    <polygon points="50,78 64,104 64,116 36,112" fill="url(#hudi-grad-c)" />
    <polygon points="78,78 64,104 64,116 92,112" fill="#FFB74D" />
  </g>
</svg>
